[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-boundary-lab"
version = "0.1.0"
description = "Toy holography-inspired neural-memory experiment: query-conditioned reconstruction of a bulk grid from a ring-shaped boundary state."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rishab Kokate" }]
keywords = ["interpretability", "neural-memory", "attention", "bottleneck", "research-prototype"]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "streamlit>=1.32",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["hermes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
